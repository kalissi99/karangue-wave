<script>
const API = 'https://m7z0x2cqh0.execute-api.eu-west-3.amazonaws.com/prod/api/v1';
const OPERATOR = 'wave';
let account = null;
let pin = '';

function fmt(n){return new Intl.NumberFormat('fr-FR').format(Math.round(n));}
function ini(n){return n?n.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase():'?';}
function gdi(){
  let id=localStorage.getItem('wave_dev');
  if(!id){id=crypto.randomUUID();localStorage.setItem('wave_dev',id);}
  return id;
}
function genRef(){return 'KP-WAVE-'+Date.now().toString(36).toUpperCase();}

async function doLogin(){
  const phoneInput=document.getElementById('lPhone').value.trim().replace(/\s/g,'');
  const phone=phoneInput.startsWith('+')?phoneInput:'+221'+phoneInput;
  const p=document.getElementById('lPin').value.trim();
  if(!phone||!p){showToast('Remplissez tous les champs');return;}
  try{
    const res=await fetch(`${API}/accounts/login`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({phone,pin:p,device_id:gdi(),
        device_name:navigator.userAgent.substring(0,50),ip_address:'127.0.0.1'})
    }).then(r=>r.json());
    if(res.success){
      account=res.account;
      account.balance=200000;
      localStorage.setItem('wave_account',JSON.stringify(account));
      startApp();
    }else{
      showToast(res.message||'Identifiants incorrects');
    }
  }catch(e){
    account={id:'DEMO',name:'Fatou Gueye',phone,balance:200000,operator:'wave'};
    localStorage.setItem('wave_account',JSON.stringify(account));
    startApp();
  }
}

function startApp(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('bnav').style.display='flex';
  document.getElementById('hName').textContent=account.name;
  document.getElementById('hPhone').textContent=account.phone;
  document.getElementById('bAmt').textContent=fmt(account.balance||0);
  loadTransactions();
}

function goPage(id,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.n-item').forEach(n=>n.classList.remove('on'));
  if(el)el.classList.add('on');
  if(id==='pg-history')loadHistory();
  window.scrollTo(0,0);
}

function goStep1(){
  document.getElementById('step1').style.display='block';
  document.getElementById('step2').style.display='none';
  document.getElementById('step3').style.display='none';
  document.getElementById('s1').className='step active';
  document.getElementById('s2').className='step todo';
  document.getElementById('s3').className='step todo';
  document.getElementById('l1').className='step-line';
  document.getElementById('l2').className='step-line';
}

function goStep2(){
  const phone=document.getElementById('tPhone').value.trim();
  const amt=parseFloat(document.getElementById('tAmt').value);
  if(!phone){showToast('Entrez un numéro');return;}
  if(!amt||amt<=0){showToast('Entrez un montant valide');return;}
  if(amt>account.balance){showToast('Solde insuffisant');return;}
  const fees=Math.max(50,Math.round(amt*0.02));
  document.getElementById('benAv').textContent=ini(phone);
  document.getElementById('benName').textContent='Destinataire Wave';
  document.getElementById('benPhone').textContent=phone;
  document.getElementById('confAmt').textContent=fmt(amt)+' FCFA';
  document.getElementById('confFees').textContent=fmt(fees)+' FCFA';
  document.getElementById('confTotal').textContent=fmt(amt+fees)+' FCFA';
  document.getElementById('step1').style.display='none';
  document.getElementById('step2').style.display='block';
  document.getElementById('s1').className='step done';
  document.getElementById('s2').className='step active';
  document.getElementById('l1').className='step-line done';
  pin='';updatePinDots();
}

function pinKey(k){if(pin.length>=6)return;pin+=k;updatePinDots();}
function pinDel(){pin=pin.slice(0,-1);updatePinDots();}
function updatePinDots(){
  for(let i=1;i<=6;i++){
    document.getElementById('pd'+i).className='pin-dot'+(i<=pin.length?' filled':'');
  }
}

async function doTransfer(){
  if(pin.length<4){showToast('Entrez votre PIN complet');return;}
  const phone=document.getElementById('tPhone').value.trim();
  const amt=parseFloat(document.getElementById('tAmt').value);
  const fees=Math.max(50,Math.round(amt*0.02));
  const ref=genRef();
  try{
    const res=await fetch(`${API}/webhook/${OPERATOR}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({transaction_id:ref,amount:amt,
        sender:account.phone,receiver:phone,operator:OPERATOR,
        timestamp:Math.floor(Date.now()/1000),nonce:crypto.randomUUID(),pin})
    }).then(r=>r.json());
    document.getElementById('txRef').textContent=ref;
    document.getElementById('sucName').textContent=phone;
    document.getElementById('sucAmt').textContent=fmt(amt)+' FCFA';
    document.getElementById('sucFees').textContent=fmt(fees)+' FCFA';
    document.getElementById('sucDate').textContent=new Date().toLocaleString('fr-FR');
    document.getElementById('sucScore').textContent=(res.risk_score||0)+'/100 — '+(res.decision||'AUTORISÉ');
    account.balance=Math.max(0,account.balance-amt-fees);
    document.getElementById('bAmt').textContent=fmt(account.balance);
    document.getElementById('step2').style.display='none';
    document.getElementById('step3').style.display='block';
    document.getElementById('s2').className='step done';
    document.getElementById('s3').className='step active';
    document.getElementById('l2').className='step-line done';
  }catch(e){
    showToast('Mode démo activé');
    document.getElementById('txRef').textContent=ref;
    document.getElementById('sucName').textContent=phone;
    document.getElementById('sucAmt').textContent=fmt(amt)+' FCFA';
    document.getElementById('sucFees').textContent=fmt(fees)+' FCFA';
    document.getElementById('sucDate').textContent=new Date().toLocaleString('fr-FR');
    document.getElementById('sucScore').textContent='12/100 — AUTORISÉ';
    account.balance=Math.max(0,account.balance-amt-fees);
    document.getElementById('bAmt').textContent=fmt(account.balance);
    document.getElementById('step2').style.display='none';
    document.getElementById('step3').style.display='block';
  }
}

function setAmt(v){document.getElementById('tAmt').value=v;}

async function loadTransactions(){
  try{
    const res=await fetch(`${API}/transactions/account/${account.id}`).then(r=>r.json());
    const txs=(res.transactions||[]).filter(t=>t.operator===OPERATOR).slice(0,5);
    renderTxList('tx-list',txs);
  }catch(e){
    document.getElementById('tx-list').innerHTML=
      '<div style="text-align:center;padding:20px;color:var(--muted)">Aucune transaction</div>';
  }
}

async function loadHistory(){
  try{
    const res=await fetch(`${API}/transactions?limit=50`).then(r=>r.json());
    const txs=(res.transactions||[]).filter(t=>
      t.sender_phone===account.phone||t.receiver_phone===account.phone);
    renderTxList('hist-list',txs);
  }catch(e){
    document.getElementById('hist-list').innerHTML=
      '<div style="text-align:center;padding:40px;color:var(--muted)">Aucune transaction</div>';
  }
}

function renderTxList(id,txs){
  const el=document.getElementById(id);
  if(!txs.length){
    el.innerHTML='<div style="text-align:center;padding:30px;color:var(--muted)">Aucune transaction</div>';
    return;
  }
  el.innerHTML=txs.map(tx=>{
    const isPos=tx.receiver_phone===account.phone;
    const sign=isPos?'+':'-';
    const scol=isPos?'pos':'neg';
    return`<div class="tx-item">
      <div class="tx-ico ${isPos?'ico-g':'ico-r'}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="${isPos?'#10b981':'#ef4444'}" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="${isPos?19:5}" x2="12" y2="${isPos?5:19}"/>
          <polyline points="${isPos?'19 12 12 19 5 12':'5 12 12 5 19 12'}"/>
        </svg>
      </div>
      <div class="tx-info">
        <div class="tx-name">${isPos?tx.sender_name||'Expéditeur':tx.receiver_name||'Destinataire'}</div>
        <div class="tx-date">${tx.created_at?new Date(tx.created_at).toLocaleDateString('fr-FR'):'-'}</div>
      </div>
      <div>
        <div class="tx-amt ${scol}">${sign}${fmt(tx.amount)} FCFA</div>
        <div class="tx-time">${tx.status==='blocked'?'Bloqué':'Réussi'}</div>
      </div>
    </div>`;
  }).join('');
}

async function checkUrl(){
  const url=document.getElementById('phUrl').value.trim();
  if(!url){showToast('Entrez une URL');return;}
  const el=document.getElementById('url-result');
  el.innerHTML='<div style="text-align:center;padding:16px;color:var(--muted)">Analyse...</div>';
  try{
    const res=await fetch(`${API}/security/check-url`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url,operator:'wave'})
    }).then(r=>r.json());
    const d=res.is_phishing;
    el.innerHTML=`<div class="ph-result ${d?'ph-danger':'ph-safe'}">
      <div class="ph-title">${d?'PHISHING DÉTECTÉ':'Lien sécurisé'} — Score ${res.risk_score}/100</div>
      ${(res.signals||[]).map(s=>`<div class="ph-signal">${s}</div>`).join('')}
    </div>`;
  }catch(e){
    const d=!url.includes('wave.com')&&!url.includes('wave.sn');
    el.innerHTML=`<div class="ph-result ${d?'ph-danger':'ph-safe'}">
      <div class="ph-title">${d?'SUSPECT':'Semble légitime'}</div>
    </div>`;
  }
}

async function checkSms(){
  const sms=document.getElementById('phSms').value.trim();
  if(!sms){showToast('Entrez le texte du SMS');return;}
  const el=document.getElementById('sms-result');
  try{
    const res=await fetch(`${API}/security/check-sms`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:sms,operator:'wave'})
    }).then(r=>r.json());
    const d=res.is_phishing||res.risk_score>50;
    el.innerHTML=`<div class="ph-result ${d?'ph-danger':'ph-safe'}" style="margin-top:12px">
      <div class="ph-title">${d?'SMS SUSPECT':'SMS légitime'} — Score ${res.risk_score}/100</div>
      ${(res.signals||[]).map(s=>`<div class="ph-signal">${s}</div>`).join('')}
    </div>`;
  }catch(e){
    const d=['code','pin','urgent','bloqué','cliquez'].some(k=>sms.toLowerCase().includes(k));
    el.innerHTML=`<div class="ph-result ${d?'ph-danger':'ph-safe'}" style="margin-top:12px">
      <div class="ph-title">${d?'SMS SUSPECT':'SMS légitime'}</div>
    </div>`;
  }
}

let tTimer=null;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(tTimer);tTimer=setTimeout(()=>el.classList.remove('show'),3000);
}

window.onload=()=>{
  const saved=localStorage.getItem('wave_account');
  if(saved){account=JSON.parse(saved);startApp();}
};
</script>
